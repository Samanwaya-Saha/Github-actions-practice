# workflow
# should have names
name: Hello
#on tells when the workflow runs
on:
  workflow_dispatch: 
# jobs says what the workflow should do,there can be one or more than one jobs,hence we write jobs
# jobs is an object so needs indentation
jobs:
    #1st job gives identation
   say-hello:
    #creates an ephermal Container with ubuntu running
       runs-on: ubuntu-latest
    # That ephermal container will have some steps to execute,hence name those steps and runs
       steps:
         - name: say hello to everyone
           run: echo "hello Dosto"
    
  
# should be inside the workflow
# steps
# should be inside the job
# Actions
# should be inside the steps
